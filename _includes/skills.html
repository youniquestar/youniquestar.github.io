<section id="skills" class="skills-section">
    <h2>Technical Skills & Expertise</h2>
    <p class="skills-intro">A multidisciplinary engineering toolkit spanning hardware design, bare-metal embedded firmware, robotic kinematics, and production AI.</p>
        
    <div class="skill-categories-grid">
        {% for cat in site.skills %}
        <div class="skills-card">
            <h3 class="category-label">{{ cat.category }}</h3>
            <ul class="skills-list">
                {% for tool in cat.tools %}
                <li class="skill">{{ tool }}</li>
                {% endfor %}
            </ul>
        </div> 
        {% endfor %}
    </div>
</section>
