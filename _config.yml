# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Main Page Setup

title: Jeremiah Alao — Robotics · AI · Embedded Systems


# Hero Section
name: Jeremiah Alao
headline: Robotics & AI Engineer
description: >-
  I design and build intelligent machines — from bare-metal embedded firmware on
  Arduino and ESP32, to ROS2 robotic manipulators and production-grade machine
  learning backends. With 37+ public repositories spanning autonomous mobile
  robots, computer-vision pipelines, predictive-maintenance engines, and IoT
  systems, I turn complex engineering problems into working hardware and
  software. Currently deepening my craft in Robotics Modelling & Control and AI
  Backend Engineering.

# Place your profile image in /assets/images/profile-image/folder and edit the file name
profile_image: ./assets/images/profile-image/avatar.jpeg


# Link your resume / academic CV
# You can place your resume in assets/resume/{resume.pdf or add external link such as pdf saved in google drive
resume-url: https://youniquestar.github.io/assets/resume/Jeremiah_Alao_Academic_CV.pdf


# Set up external links - this will show up as small icons next to your name.

external-links:    # input only your own url slug. The icons with missing entries will not appear.
  linkedin: jeremiah-alao    # https://www.linkedin.com/in/{your url slug}
  github: youniquestar    # https://github.com/{your url slug}
  stackoverflow:      # https://stackoverflow.com/users/{your url slug}
  medium:            # https://medium.com/@{your url slug}
  x-twitter:   # https://x.com/{your url slug}
  threads:            # https://threads.net/@{your url slug}
  instragram:       # https://instagram.com/{your url slug}
  youtube:           # https://youtube.com/@{your url slug}
  discord:            # https://discord.com/users/{your url slug}
  bluesky:           # https://bsky.app/profile/{your url slug}


# Skills Section - Add the list of your Skills by categories/tools. The indentation for each level needs to be precise.
skills:
  - category: Programming Languages
    tools:
    - Python
    - C++
    - SQL
    - Shell / Bash
  - category: Robotics & Control
    tools:
    - ROS2 Jazzy
    - Forward & Inverse Kinematics
    - Differential Drive Navigation
    - Ultrasonic / IR Sensor Fusion
    - PID & Motion Control
    - URDF / Xacro Modelling
    - Gazebo Simulation
  - category: AI & Machine Learning
    tools:
    - Scikit-learn
    - Pandas / NumPy
    - NLP & Regex Engines
    - Predictive Maintenance Pipelines
    - Conversational AI / Chatbots
    - Data Preprocessing & Feature Engineering
  - category: Embedded Systems & IoT
    tools:
    - Arduino (Nano, Uno, Mega)
    - ESP32 (ESP-NOW, FreeRTOS)
    - SPI / I2C / UART Protocols
    - PWM Servo & Motor Control
    - RFID (MFRC522)
    - Relay & Actuator Interfacing
    - Sensor Integration (DHT11, HC-SR04, IR, LDR, Soil Moisture)
  - category: Backend & Web Development
    tools:
    - Django
    - FastAPI
    - REST API Design
    - PostgreSQL
    - Git & GitHub
  - category: CAD & Prototyping
    tools:
    - Autodesk Fusion 360
    - FreeCAD
    - 3D Printing (FDM)
    - Breadboarding & Circuit Design
  - category: Tools & Platforms
    tools:
    - Linux / Ubuntu
    - VS Code
    - Arduino IDE / PlatformIO
    - PyCharm
    - Docker (basics)


# Contact Form Setup. Setup an account and copy over the key. When someone fills out the form, it will be received in your email.
formspree-key:   https://formspree.io/f/xcontact



# Active theme
colors:
  text: "#e0e0e0"
  border: "#2a2d35"
  link: "#64b5f6"
  highlight: "#42a5f5"
  background: "#121417"
  light_background: "#1a1d23"


#########################################################################################################
# Build settings for the site. Editing the below may cause the site to malfunction.

collections:
  projects:
    output: true
    permalink: /projects/:path/


markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
      indent: 0

plugins:
  - jekyll-feed

include:
  - _projects


